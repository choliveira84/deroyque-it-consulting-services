openapi: 3.0.3
info:
  title: Product Activation API
  version: 1.0.0
  description: Customer product activation registration, status tracking, and query API.
paths:
  /api/v1/requests:
    post:
      summary: Register a product activation request
      operationId: createActivationRequest
      security:
        - OAuth2Bearer: [activations:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActivationRequest'
      responses:
        '201':
          description: Request created successfully
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/requests/0b7f3c1e-5d2a-4c4e-9a51-2f8d7b1e6c90
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationResponse'
        '200':
          description: Idempotent replay of previously registered request with identical payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationResponse'
        '400':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Missing or invalid authentication token
        '403':
          description: Insufficient scope (requires activations:write)
        '409':
          description: Conflict - externalId already exists with divergent payload
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    get:
      summary: List activation requests with filtering and pagination
      operationId: listActivationRequests
      security:
        - OAuth2Bearer: [activations:read]
      parameters:
        - name: customerId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ActivationStatus'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated activation requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivationResponse'
        '401':
          description: Missing or invalid token
        '403':
          description: Insufficient scope (requires activations:read)

  /api/v1/requests/{id}:
    get:
      summary: Get activation request status by ID
      operationId: getActivationRequestById
      security:
        - OAuth2Bearer: [activations:read]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Activation request found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationResponse'
        '404':
          description: Request not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  securitySchemes:
    OAuth2Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ActivationStatus:
      type: string
      enum: [PENDING, PROCESSING, COMPLETED, FAILED]

    CreateActivationRequest:
      type: object
      required:
        - externalId
        - customerId
        - productCode
      properties:
        externalId:
          type: string
          example: EXT-12345
          maxLength: 100
        customerId:
          type: string
          example: CUST-10001
          maxLength: 100
        productCode:
          type: string
          example: INTERNET-500
          maxLength: 100

    ActivationResponse:
      type: object
      required:
        - id
        - externalId
        - customerId
        - productCode
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          example: 0b7f3c1e-5d2a-4c4e-9a51-2f8d7b1e6c90
        externalId:
          type: string
          example: EXT-12345
        customerId:
          type: string
          example: CUST-10001
        productCode:
          type: string
          example: INTERNET-500
        status:
          $ref: '#/components/schemas/ActivationStatus'
        failureReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          example: "2026-10-28T18:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-28T18:00:00Z"

    PaginatedActivationResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ActivationResponse'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          example: 42
        totalPages:
          type: integer
          example: 3

    ProblemDetail:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          example: https://api.deroyque.com/problems/validation-error
        title:
          type: string
          example: Invalid Request Data
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: One or more validation constraints were violated.
        instance:
          type: string
          example: /api/v1/requests
        traceId:
          type: string
          example: 4bf92f3577b34da6a3ce929d0e0e4736
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
