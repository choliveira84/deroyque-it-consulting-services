name: CI

on:
  push:
    branches:
      - main
      - '00*'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Test & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Build and verify with Maven (Unit, ArchUnit & Integration Tests)
        run: ./mvnw --batch-mode clean verify

      - name: Verify Docker build packaging (Smoke Test)
        run: docker build -t product-activation-service:test .
