openapi: 3.0.3
info:
  title: Deroyque Product Activation Service API
  description: High-performance, idempotent product activation service following Hexagonal Architecture and the Transactional Outbox pattern.
  version: 1.0.0
  contact:
    name: Deroyque IT Consulting Services
    url: https://deroyque.com
servers:
  - url: http://localhost:8080
    description: Local / Development Server

paths:
  /api/v1/requests:
    post:
      summary: Create or replay an activation request
      description: |
        Asynchronously initiates product activation. Enforces idempotency via `externalId`:
        - New request: creates request and outbox message, returns 201 Created.
        - Identical replay: returns 200 OK with the existing record.
        - Divergent replay: returns 409 Conflict.
      operationId: createActivationRequest
      tags:
        - Activation Requests
      security:
        - bearerAuth:
            - activations:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActivationRequest'
            example:
              externalId: "REQ-EXT-001"
              customerId: "CUST-1001"
              productCode: "FIBER-500"
      responses:
        '201':
          description: Activation request successfully accepted for asynchronous processing
          headers:
            Location:
              schema:
                type: string
              description: URI of the created activation request
            X-Correlation-Id:
              schema:
                type: string
              description: Distributed tracing correlation identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationResponse'
        '200':
          description: Idempotent replay of an existing activation request with identical parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationResponse'
        '400':
          description: Validation error or malformed request payload (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Missing or invalid OAuth 2.0 Bearer JWT token
        '403':
          description: Insufficient privileges (requires scope 'activations:write')
        '409':
          description: Conflict caused by divergent payload for an existing externalId (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    get:
      summary: List activation requests with filtering and pagination
      description: Returns a paginated list of activation requests with optional filters by customer ID and status.
      operationId: listActivationRequests
      tags:
        - Activation Requests
      security:
        - bearerAuth:
            - activations:read
      parameters:
        - name: customerId
          in: query
          required: false
          schema:
            type: string
          description: Filter by customer identifier
          example: "CUST-1001"
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ActivationStatus'
          description: Filter by activation lifecycle status
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Zero-based page index
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Page size
      responses:
        '200':
          description: Paginated activation requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivationResponse'
        '401':
          description: Missing or invalid OAuth 2.0 Bearer JWT token
        '403':
          description: Insufficient privileges (requires scope 'activations:read')

  /api/v1/requests/{id}:
    get:
      summary: Retrieve an activation request by ID
      description: Returns the current state, lifecycle status, and failure reason (if any) of an activation request.
      operationId: getActivationRequestById
      tags:
        - Activation Requests
      security:
        - bearerAuth:
            - activations:read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique activation request UUID
      responses:
        '200':
          description: Activation request details found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationResponse'
        '401':
          description: Missing or invalid OAuth 2.0 Bearer JWT token
        '403':
          description: Insufficient privileges (requires scope 'activations:read')
        '404':
          description: Activation request not found (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 Bearer JWT token (under dev profile, use `Bearer dev-token`).

  schemas:
    CreateActivationRequest:
      type: object
      required:
        - externalId
        - customerId
        - productCode
      properties:
        externalId:
          type: string
          maxLength: 100
          description: Client-supplied unique idempotency key
          example: "REQ-EXT-001"
        customerId:
          type: string
          maxLength: 100
          description: Customer identifier
          example: "CUST-1001"
        productCode:
          type: string
          maxLength: 100
          description: Product or service SKU code to activate
          example: "FIBER-500"

    ActivationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Internal unique UUID of the activation request
        externalId:
          type: string
          description: Client idempotency key
        customerId:
          type: string
          description: Customer identifier
        productCode:
          type: string
          description: Product SKU code
        status:
          $ref: '#/components/schemas/ActivationStatus'
        failureReason:
          type: string
          nullable: true
          description: Error details if activation failed
        createdAt:
          type: string
          format: date-time
          description: Timestamp when request was initially received
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when request was last updated

    ActivationStatus:
      type: string
      enum:
        - PENDING
        - PROCESSING
        - COMPLETED
        - FAILED
      description: Lifecycle status of the activation request

    PaginatedActivationResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ActivationResponse'
        page:
          type: integer
          description: Current page index
        size:
          type: integer
          description: Current page size
        totalElements:
          type: integer
          format: int64
          description: Total number of records matching query
        totalPages:
          type: integer
          description: Total number of pages
        last:
          type: boolean
          description: Whether this is the last page

    ProblemDetail:
      type: object
      description: RFC 9457 Problem Details for HTTP APIs
      properties:
        type:
          type: string
          format: uri
          description: URI reference identifying the problem type
          example: "https://api.deroyque.com/problems/conflict"
        title:
          type: string
          description: Short human-readable summary
          example: "Request Conflict"
        status:
          type: integer
          description: HTTP status code
          example: 409
        detail:
          type: string
          description: Detailed explanation specific to this occurrence
          example: "Conflict on activation with externalId 'REQ-EXT-001': An activation request with this externalId already exists with divergent payload"
        instance:
          type: string
          description: URI of the specific occurrence
          example: "/api/v1/requests"
        traceId:
          type: string
          description: Distributed tracing correlation identifier
          example: "7b4c6e91f08d"
        invalidParams:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
