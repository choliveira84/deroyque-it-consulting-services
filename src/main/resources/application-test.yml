spring:
  application:
    name: product-activation-service-test
  datasource:
    url: jdbc:h2:mem:activation_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

activation:
  provider:
    base-url: http://localhost:${wiremock.server.port:8089}
    connect-timeout-ms: 1000
    read-timeout-ms: 2000
    max-retries: 2
    initial-backoff-ms: 100

logging:
  level:
    com.deroyque.activation: DEBUG
